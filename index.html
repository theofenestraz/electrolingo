<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Electrolingo</title><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="favicon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Electrolingo"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Electrolingo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna de móvil (máx. 560px) con barra de pestañas fija abajo, botones gruesos con sombra inferior y un camino de temas en zigzag por asignatura. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f7f7f7;
  --ink: #3c3c3c;
  --ink-2: #777777;
  --ink-3: #afafaf;
  --line: #e5e5e5;
  --ok: #58cc02;
  --ok-dark: #58a700;
  --ok-bg: #d7ffb8;
  --ok-ink: #58a700;
  --bad: #ff4b4b;
  --bad-dark: #ea2b2b;
  --bad-bg: #ffdfe0;
  --bad-ink: #ea2b2b;
  --gold: #ffc800;
  --gold-dark: #e5a500;
  --flame: #ff9600;
  --sel: #1cb0f6;
  --sel-bg: #ddf4ff;
  --inf: #1cb0f6;
  --ing: #00c2a8;
  --fis: #ff9600;
  --mat: #ce82ff;
  --eg: #ff86d0;
  --f-ui: "Nunito", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131f24; --surface: #131f24; --surface-2: #202f36; --ink: #f1f7fb; --ink-2: #b7c3c9; --ink-3: #52656d;
    --line: #37464f; --ok-bg: #1d3a12; --ok-ink: #79d634; --bad-bg: #3d1f22; --bad-ink: #ff7878; --sel-bg: #1b3a4b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131f24; --surface: #131f24; --surface-2: #202f36; --ink: #f1f7fb; --ink-2: #b7c3c9; --ink-3: #52656d;
  --line: #37464f; --ok-bg: #1d3a12; --ok-ink: #79d634; --bad-bg: #3d1f22; --bad-ink: #ff7878; --sel-bg: #1b3a4b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 600 16px/1.45 var(--f-ui);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
.app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 170px;
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--f-ui); font-weight: 900; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; font-weight: 800; }
p { margin: 0; }
.eyebrow { font: 800 .74rem/1.1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.mono { font-variant-numeric: tabular-nums; }
code, .code-font { font-family: var(--f-mono); }

/* barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; border-bottom: 2px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.brand { font: 900 1.35rem/1 var(--f-ui); color: var(--ok); letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
.brand .logo { width: 30px; height: 34px; flex: none; }
.brand .logo .cap { stroke: var(--cap-line, none); stroke-width: 3; stroke-linejoin: round; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cap-line: #b7c3c9; } }
:root[data-theme="dark"] { --cap-line: #b7c3c9; }
.stats { display: flex; gap: 14px; align-items: center; }
.stat-chip { display: inline-flex; align-items: center; gap: 5px; font: 900 1rem/1 var(--f-ui); color: var(--ink-3); }
.stat-chip svg { width: 24px; height: 24px; }
.stat-chip.flame { color: var(--flame); }
.stat-chip.gold { color: var(--gold-dark); }
.stat-chip.blue { color: var(--sel); }

/* tarjetas */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; color: var(--sel); font: 900 .9rem var(--f-ui); text-transform: uppercase; letter-spacing: .05em; padding: 4px; }

/* botones gruesos */
.btn {
  --c: var(--ok); --cd: var(--ok-dark);
  border: 0; border-radius: 16px; padding: 14px 18px; min-height: 52px; flex: 1;
  background: var(--c); color: #fff; font: 900 1rem/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase;
  box-shadow: 0 4px 0 var(--cd); transition: transform .06s, box-shadow .06s; margin-bottom: 4px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--cd); }
.btn.sub { --cd: color-mix(in srgb, var(--c) 72%, #000); }
.btn.secondary { background: var(--surface); color: var(--sel); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.ok { --c: var(--ok); --cd: var(--ok-dark); }
.btn.bad { --c: var(--bad); --cd: var(--bad-dark); }
.btn:disabled { --c: var(--line); --cd: var(--line); color: var(--ink-3); box-shadow: 0 4px 0 var(--line); }
.mini {
  --c: var(--sel); border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px;
  font: 800 .85rem var(--f-ui); color: var(--c); box-shadow: 0 3px 0 var(--line); margin-bottom: 3px;
}
.mini.primary { background: var(--c); color: #fff; border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 72%, #000); }
.back { border: 0; background: none; padding: 6px 0; font: 800 .95rem var(--f-ui); color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; }

.badge { font: 800 .7rem/1 var(--f-ui); padding: 5px 8px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); letter-spacing: .03em; white-space: nowrap; text-transform: uppercase; }
.badge.hot { background: var(--c, var(--sel)); color: #fff; }
.badge.warn { background: var(--bad-bg); color: var(--bad-ink); }

.bar { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--ok)); position: relative; transition: width .4s; }
.bar i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 99px; background: rgb(255 255 255 / .3); }
.bar.thin { height: 10px; }
.bar.thin i::after { display: none; }

/* pestañas inferiores */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 2px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 2px solid transparent; background: none; border-radius: 14px; padding: 6px 2px 4px; display: grid; justify-items: center; gap: 2px; font: 800 .72rem/1 var(--f-ui); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.tab svg { width: 30px; height: 30px; }
.tab[aria-current="page"] { border-color: color-mix(in srgb, var(--sel) 45%, transparent); background: var(--sel-bg); color: var(--sel); }

/* inicio */
.goal { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 900 1.3rem/1 var(--f-ui); }
.ring .num small { display: block; font: 800 .68rem var(--f-ui); color: var(--ink-3); margin-top: 2px; }
.exam { --c: var(--sel); background: var(--c); color: #fff; border-radius: var(--r); padding: 16px; display: grid; gap: 12px; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 72%, #000); }
.exam .eyebrow { color: rgb(255 255 255 / .8); }
.exam-row { display: flex; gap: 14px; align-items: center; }
.countdown { min-width: 64px; text-align: center; border-radius: 14px; padding: 8px 6px; background: rgb(255 255 255 / .22); }
.countdown b { display: block; font: 900 1.7rem/1 var(--f-ui); }
.countdown span { font: 800 .64rem/1 var(--f-ui); text-transform: uppercase; letter-spacing: .06em; }
.exam .mini { background: #fff; color: var(--c); border-color: #fff; box-shadow: 0 3px 0 rgb(0 0 0 / .18); justify-self: start; }
.exam-list { display: grid; gap: 4px; font-size: .9rem; }
.exam-list div { display: flex; justify-content: space-between; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { --c: var(--sel); display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); padding: 8px 12px 8px 8px; font: 800 .92rem var(--f-ui); box-shadow: 0 3px 0 var(--line); margin-bottom: 3px; color: var(--ink); }
.pick .ico { width: 30px; height: 30px; border-radius: 9px; background: var(--c); color: #fff; display: grid; place-items: center; }
.pick .ico svg { width: 18px; height: 18px; }
.pick[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); box-shadow: 0 3px 0 var(--c); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 4px; font: 900 .95rem var(--f-ui); color: var(--ink-2); box-shadow: 0 3px 0 var(--line); margin-bottom: 3px; }
.seg button[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-bg); color: var(--sel); box-shadow: 0 3px 0 var(--sel); }

/* asignaturas */
.subj-list { display: grid; gap: 14px; }
.subj-card { --c: var(--sel); display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left;
  border: 2px solid var(--line); border-radius: 18px; background: var(--surface); padding: 14px; box-shadow: 0 4px 0 var(--line); margin-bottom: 4px; }
.subj-card:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.subj-ico { width: 64px; height: 64px; border-radius: 18px; background: var(--c); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 72%, #000); }
.subj-ico svg { width: 34px; height: 34px; }
.subj-card .body { display: grid; gap: 6px; min-width: 0; }
.subj-card .meta { font-size: .85rem; color: var(--ink-2); }
.subj-card .chev { color: var(--ink-3); }
.subj-card .badges { display: flex; gap: 6px; flex-wrap: wrap; }

/* camino de temas */
.unit { --c: var(--sel); background: var(--c); color: #fff; border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 72%, #000); }
.unit .eyebrow { color: rgb(255 255 255 / .82); }
.unit .back { color: rgb(255 255 255 / .9); padding: 0; }
.unit-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.unit .mini { background: rgb(255 255 255 / .18); color: #fff; border-color: rgb(255 255 255 / .45); box-shadow: 0 3px 0 rgb(0 0 0 / .15); }
.unit .mini.primary { background: #fff; color: var(--c); border-color: #fff; }
.path { display: grid; justify-items: center; gap: 22px; padding-block: 18px 8px; overflow-x: clip; }
.stop { display: grid; justify-items: center; gap: 8px; width: min(230px, 100%); }
.node { --c: var(--sel); width: 74px; height: 70px; border-radius: 50%; border: 0; background: var(--c); color: #fff; display: grid; place-items: center;
  box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 70%, #000); position: relative; margin-bottom: 7px; }
.node:active { transform: translateY(6px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 70%, #000); }
.node svg { width: 34px; height: 34px; }
.node.new { opacity: .92; }
.node.done { background: var(--gold); box-shadow: 0 7px 0 var(--gold-dark); }
.node.next { outline: 6px solid color-mix(in srgb, var(--c) 30%, transparent); outline-offset: 5px; }
.node .ring-pct { position: absolute; inset: -10px; pointer-events: none; }
.stop .label { font: 800 .86rem/1.2 var(--f-ui); text-align: center; max-width: 100%; color: var(--ink); }
.stop .label small { display: block; font-weight: 700; color: var(--ink-3); }
.bubble { --c: var(--sel); background: var(--surface); color: var(--c); border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; font: 900 .8rem var(--f-ui); text-transform: uppercase; letter-spacing: .05em; position: relative; animation: bob 1.6s ease-in-out infinite; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* hoja inferior */
.sheet-back { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .45); display: grid; align-items: end; }
.sheet { --c: var(--sel); background: var(--surface); border-radius: 22px 22px 0 0; border-top: 6px solid var(--c); max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 14px;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); max-height: 85vh; overflow: auto; }
.sheet .btns { display: grid; gap: 10px; }

/* progreso y ajustes */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile-stat { border: 2px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.tile-stat svg { width: 30px; height: 30px; }
.tile-stat b { display: block; font: 900 1.25rem/1.1 var(--f-ui); }
.tile-stat span { font-size: .8rem; color: var(--ink-3); font-weight: 800; }
.sub-row { --c: var(--sel); display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.sub-row .subj-ico { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 72%, #000); }
.sub-row .subj-ico svg { width: 22px; height: 22px; }
.week svg { width: 100%; height: 130px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--sc); }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 6px; }
.setting + .setting { border-top: 2px solid var(--line); padding-top: 14px; }
.switch { width: 56px; height: 32px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 2px 0 rgb(0 0 0 / .15); }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { left: 28px; }
.foot { font-size: .8rem; color: var(--ink-3); display: grid; gap: 4px; text-align: center; }

/* barra de acción de sesión */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 2px solid var(--line);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dock-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; flex-wrap: wrap; }
.dock.fb-ok { background: var(--ok-bg); border-top-color: transparent; }
.dock.fb-bad { background: var(--bad-bg); border-top-color: transparent; }
.dock .feedback { flex-basis: 100%; display: grid; gap: 8px; max-height: 46vh; overflow: auto; }
.feedback h3 { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; }
.feedback .fb-ico { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
.feedback .fb-ico svg { width: 20px; height: 20px; }
.dock.fb-ok .feedback, .dock.fb-ok h3 { color: var(--ok-ink); }
.dock.fb-bad .feedback, .dock.fb-bad h3 { color: var(--bad-ink); }
.feedback .rich, .feedback p { color: var(--ink); font-weight: 600; }
.feedback .model { background: var(--surface); border-radius: 12px; padding: 10px; font-size: .92rem; color: var(--ink); }
.feedback.neutral h3 { color: var(--ink); }

/* sesión */
.sess-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 12px 6px; display: grid; gap: 8px; }
.sess-bar { display: flex; gap: 14px; align-items: center; }
.x { width: 36px; height: 36px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; flex: none; padding: 0; }
.x svg { width: 26px; height: 26px; }
.prog { flex: 1; height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--sc, var(--ok)); border-radius: 99px; transition: width .35s; position: relative; }
.prog i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgb(255 255 255 / .3); }
.timer { font: 900 .95rem var(--f-ui); color: var(--ink-3); min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
.phase { display: flex; gap: 8px; align-items: center; font: 800 .82rem var(--f-ui); color: var(--sc); text-transform: uppercase; letter-spacing: .05em; }
.phase .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); }
.phase .muted { text-transform: none; letter-spacing: 0; }

.q { font: 900 1.35rem/1.3 var(--f-ui); }
.stage { display: grid; gap: 16px; }
.lesson { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; box-shadow: 0 4px 0 var(--line); }
.lesson h2 { font-size: 1.35rem; color: var(--sc, var(--ink)); }
.rich { display: grid; gap: 10px; font-size: 1.04rem; font-weight: 600; }
.rich strong { font-weight: 900; }
.rich ul, .rich ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.rich code { font: .88em var(--f-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 6px; border: 1px solid var(--line); }
pre.code { margin: 0; font: .86rem/1.5 var(--f-mono); background: #1e2b32; color: #e7edf5; padding: 12px 14px; border-radius: 12px; overflow-x: auto; white-space: pre; }
pre.code .k { color: #7cc7ff; } pre.code .s { color: #ffd479; } pre.code .c { color: #8a9ba5; font-style: italic; } pre.code .n { color: #9be3a0; }

.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 13px 14px; display: flex; gap: 12px; align-items: center; min-height: 56px; font: 700 1rem var(--f-ui); box-shadow: 0 4px 0 var(--line); margin-bottom: 4px; color: var(--ink); }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.opt .key { font: 900 .8rem var(--f-ui); width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); color: var(--ink-3); display: grid; place-items: center; flex: none; }
.opt[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-bg); box-shadow: 0 4px 0 var(--sel); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 4px 0 var(--ok); color: var(--ok-ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 4px 0 var(--bad); color: var(--bad-ink); }
.opt.right .key { border-color: var(--ok); color: var(--ok-ink); } .opt.wrong .key { border-color: var(--bad); color: var(--bad-ink); }
.opt:disabled { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---------- texto enriquecido ---------- */
function hlC(code) {

/* ---------- sonido ---------- */
let actx = null;

/* ---------- estado y guardado ---------- */
const LS = "pulso-gieia-v1";
const state = {
  bundle: null, subj: {}, items: {}, p: null, srs: {}, db: null, uid: null, sample: undefined,
  sync: "local", selected: new Set(), minutes: 25, view: "home", session: null, dirty: new Set(),

}
function lsRead() { try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { return null; } }

async function connectCloud() {
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    state.isOwner = await user.isOwner().catch(() => false);

    const uid = await user.id();
    if (!uid) return;
    state.db = db; state.uid = uid;
    const base = `data/users/${uid}/`;
    const pd = await db.doc(base + "progress").get();
    if (pd.exists && (pd.data().updated || 0) >= (state.p.updated || 0)) state.p = mergeProgress(structuredClone(pd.data()));
    else if (state.p.updated) state.dirty.add("p");
    for (const s of state.bundle.subjects) {
      const d = await db.doc(base + "srs-" + s.id).get();
      const local = state.srs[s.id];
      if (d.exists && (d.data().updated || 0) >= (local.updated || 0)) state.srs[s.id] = Object.assign({ updated: 0, items: {} }, structuredClone(d.data()));

function mergeProgress(p) { const f = freshProgress(); return Object.assign(f, p, { settings: Object.assign(f.settings, p.settings || {}) }); }

/* ---------- datos derivados ---------- */
function examsFor(sid) {

}
function examDays(e) { return dayNum(new Date(e.date)) - TODAY(); }
function nextExam(sid) { const l = examsFor(sid); return l.length ? l[0] : null; }
function srsOf(sid) { return state.srs[sid].items; }
function dueItems(sid) {

  const ex = nextExam(s.id); const ed = ex ? examDays(ex) : null;

  if (p.lastDay >= t - 1) return { n: p.streak, risk: p.lastDay === t - 1 };

/* ---------- repetición espaciada ---------- */
function schedule(sid, id, q) {

/* ---------- construcción de la sesión ---------- */

function pickWeighted(pool) {

}
function planSubject(s, secs, opts = {}) {
  const steps = []; let t = 0; const used = new Set(); const st = srsOf(s.id); const today = TODAY();
  const seen = s.topics.filter(tp => state.p.seen[tp.id]);
  const push = (it, phase) => { steps.push({ k: "item", phase, sid: s.id, id: it.id }); used.add(it.id); t += est(it); };
  const res = opts.reserved || new Set();

  if (opts.topic) {
    const tp = s.topics.find(x => x.id === opts.topic);
    tp.lesson.forEach((ls, i) => { steps.push({ k: "lesson", phase: "lesson", sid: s.id, tid: tp.id, i }); t += LESSON_SECS; });
    for (const it of shuffle(tp.items)) push(it, "practice");

  }
  // 1. repasos que tocan hoy
  const due = dueItems(s.id).sort((a, b) => st[a][0] - st[b][0] || st[b][4] - st[a][4]);
  const revCap = secs * (opts.exam ? 0.5 : 0.35);
  for (const id of due) { if (res.has(id)) continue; const it = state.items[id]; if (t + est(it) > revCap) break; push(it, "review"); }
  // 2. lección nueva
  let newTp = null;
  if (!opts.exam) {
    const nt = nextTopic(s);
    if (nt) {
      const cost = nt.lesson.length * LESSON_SECS + 150;
      if (secs - t > cost || !seen.length) {
        newTp = nt;
        nt.lesson.forEach((ls, i) => { steps.push({ k: "lesson", phase: "lesson", sid: s.id, tid: nt.id, i }); t += LESSON_SECS; });
        const firsts = shuffle(nt.items.filter(x => !st[x.id] && !res.has(x.id))).sort((a, b) => est(a) - est(b)).slice(0, 5);

    const cands = [];
    subs.forEach(s => {
      const nt = exam ? null : nextTopic(s);
      s.topics.forEach(tp => {
        if (!(exam || state.p.seen[tp.id] || tp === nt)) return;
        tp.items.forEach(it => { if (["mc", "tf", "fill", "num"].includes(it.t)) cands.push({ sid: s.id, it }); });

/* ---------- sesión ---------- */
let tick = null, lastTick = 0;
function startTimer() {
  clearInterval(tick); lastTick = Date.now();
  tick = setInterval(() => {
    const S = state.session; if (!S || state.view !== "session") return;
    const now = Date.now(); const dt = Math.min(5, (now - lastTick) / 1000); lastTick = now;
    if (document.visibilityState !== "visible") return;
    S.elapsed += dt;
    const sid = currentSid(); S.perSubj[sid] = (S.perSubj[sid] || 0) + dt;
    logTime(sid, dt);
    if (!S.dayMarked && todayLog().m >= 600) { S.dayMarked = markStudyDay(); }
    const el = $("#timer"); if (el) el.textContent = fmtClock(Math.max(0, S.budget - S.elapsed));
    if (S.elapsed - (S.lastSave || 0) >= 30) { S.lastSave = S.elapsed; touch("p"); }
  }, 1000);
}
function fmtClock(s) { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function currentSid() { const S = state.session; const st = S.steps[Math.min(S.idx, S.steps.length - 1)]; return st ? st.sid : S.sids[0]; }
const PHASE = { review: "Calentamiento · repaso", lesson: "Lección nueva", practice: "Práctica", retry: "Segunda oportunidad", test: "Mini test final" };

function startSession(opts) {
  const S = buildSession(opts);
  if (!S.steps.length) { toast("No hay ejercicios disponibles para esa selección."); return; }
  state.session = S; state.view = "session";
  startTimer(); renderStep();
}
function saveSessionLocal() {
  const S = state.session; if (!S) return;
  try { localStorage.setItem(LS + "-sess", JSON.stringify(Object.assign({}, S, { retried: [...S.retried], savedDay: TODAY() }))); } catch (e) { /* nada */ }
}
function clearSessionLocal() { try { localStorage.removeItem(LS + "-sess"); } catch (e) { /* nada */ } }

function renderStep() {
  const S = state.session;
  if (S.idx >= S.steps.length) return finishSession();
  const step = S.steps[S.idx]; const s = state.subj[step.sid];
  setNav(false);
  const pct = Math.round(S.idx / S.steps.length * 100);
  S.answered = false;
  const head = `<div class="sess-top" style="--sc:${sc(s.id)}">
      <div class="sess-bar"><button class="x" data-act="quit" aria-label="Terminar sesión">${ICON.x}</button>
      <div class="prog"><i style="width:${pct}%"></i></div><span class="timer mono" id="timer">${fmtClock(Math.max(0, S.budget - S.elapsed))}</span></div>
      <div class="phase"><span class="dot"></span><b>${PHASE[step.phase]}</b><span class="muted">· ${esc(s.name)}</span></div>
    </div>`;
  if (step.k === "lesson") {
    const tp = s.topics.find(x => x.id === step.tid); const ls = tp.lesson[step.i];
    root.innerHTML = head + `<div class="stage" style="--sc:${sc(s.id)}">

    setDock(`<button class="btn" data-act="lessonnext">${step.i + 1 < tp.lesson.length ? "Siguiente" : "Ponerlo a prueba"}</button>`);

function qHtml(it) { return `<p class="q">${inline(it.q || "")}</p>${codeBlock(it.code)}`; }
function itemHtml(it) {
  const S = state.session;
  switch (it.t) {

      const order = shuffle(it.o.map((_, i) => i)); S.mcOrder = order;
      return qHtml(it) + `<div class="opts">${order.map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="key">${"ABCDEF"[k]}</span><span>${inline(it.o[oi])}</span></button>`).join("")}</div>`;
    }
    case "tf":
      return `<div class="eyebrow">Verdadero o falso</div>` + qHtml(it) + `<div class="tf"><button class="opt" data-v="1">Verdadero</button><button class="opt" data-v="0">Falso</button></div>`;
    case "fill":
      return `<div class="eyebrow">Completa</div>` + qHtml(it) + `<input class="field" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta">`;
    case "num":
      return `<div class="eyebrow">Calcula</div>` + qHtml(it) + `<div style="display:flex;gap:10px;align-items:center"><input class="field" id="ans" inputmode="decimal" autocomplete="off" placeholder="Resultado">${it.u ? `<span class="unit-lbl">${esc(it.u)}</span>` : ""}</div>`;
    case "match": {

    }
    case "order": {

      S.orderPool = idx; S.orderSeq = [];
      return `<div class="eyebrow">Ordena</div><p class="q">${inline(it.q)}</p><div class="order-slots" id="slots"><span class="muted" style="font-size:.85rem">Toca los pasos en orden. Toca uno colocado para devolverlo.</span></div><div class="order-pool" id="pool"></div>`;

function dockFor(it) {
  if (["fill", "num"].includes(it.t)) return `<button class="btn" data-act="check">Comprobar</button>`;
  if (it.t === "open") return `<button class="btn secondary" data-act="skipopen">No lo sé</button><button class="btn" data-act="check">Corregir</button>`;
  if (it.t === "order") return `<button class="btn" data-act="check" id="ordercheck" disabled>Comprobar</button>`;
  if (it.t === "flash") return `<button class="btn" data-act="flip">Girar tarjeta</button>`;
  return "";
}

function bindItem(it) {
  const S = state.session, stage = $("#stage");
  if (it.t === "mc") stage.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (S.answered) return;
    const ok = +b.dataset.oi === it.a;
    stage.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.oi === it.a) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    answer(it, ok);
  }));
  if (it.t === "tf") stage.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    if (S.answered) return;
    const v = b.dataset.v === "1", ok = v === it.a;
    stage.querySelectorAll(".opt").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === it.a) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    answer(it, ok);
  }));
  if (["fill", "num"].includes(it.t)) {
    const inp = $("#ans"); setTimeout(() => inp.focus({ preventScroll: true }), 50);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkTyped(it); } });
  }
  if (it.t === "match") {
    let selL = null, selR = null, errs = 0, done = 0;
    const tiles = stage.querySelectorAll(".tile");
    const tryPair = () => {
      if (selL == null || selR == null) return;
      const bl = stage.querySelector(`.tile[data-side="l"][data-i="${selL}"]`), br = stage.querySelector(`.tile[data-side="r"][data-i="${selR}"]`);
      if (selL === selR) { bl.classList.add("done"); br.classList.add("done"); done++; beep(true); }
      else { errs++; [bl, br].forEach(x => { x.classList.remove("shake"); void x.offsetWidth; x.classList.add("shake"); }); beep(false); }
      bl.setAttribute("aria-pressed", "false"); br.setAttribute("aria-pressed", "false"); selL = selR = null;
      if (done === it.p.length) answer(it, errs <= 1, { note: errs ? `${errs} fallo${errs > 1 ? "s" : ""} al emparejar` : "Sin fallos", silent: true });
    };
    tiles.forEach(b => b.addEventListener("click", () => {
      const side = b.dataset.side, i = +b.dataset.i;
      stage.querySelectorAll(`.tile[data-side="${side}"]`).forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      if (side === "l") selL = i; else selR = i;
      tryPair();
    }));
  }
  if (it.t === "order") drawOrder(it);
  if (it.t === "sort") drawSort(it);
  if (it.t === "flash") $("#flash").addEventListener("click", flipFlash);
}
function drawOrder(it) {

  pool.innerHTML = S.orderPool.map(i => `<button class="tile" data-i="${i}" data-from="pool">${inline(it.s[i])}</button>`).join("");

    const i = +b.dataset.i;
    if (b.dataset.from === "pool") { S.orderPool = S.orderPool.filter(x => x !== i); S.orderSeq.push(i); }
    else { S.orderSeq = S.orderSeq.filter(x => x !== i); S.orderPool.push(i); }
    drawOrder(it);
  }));
  const c = $("#ordercheck"); if (c) c.disabled = S.orderPool.length > 0;
}
function drawSort(it) {
  const S = state.session, box = $("#sortbox");
  if (S.sortIdx >= S.sortList.length) {

    box.innerHTML = "";

    return;
  }
  const [text, cat] = S.sortList[S.sortIdx];
  box.innerHTML = `<div style="display:grid;gap:12px"><div class="sort-count">${S.sortIdx + 1} / ${S.sortList.length}</div>
    <div class="sort-card" id="sc">${inline(text)}</div>
    <div class="sort-cats">${it.c.map((c, k) => `<button class="opt" style="justify-content:center" data-k="${k}">${inline(c)}</button>`).join("")}</div></div>`;
  typeset(box);
  box.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const k = +b.dataset.k, ok = k === cat;

function flipFlash() {

function checkTyped(it) {
  const S = state.session; if (S.answered) return;
  const inp = $("#ans"); const v = inp.value.trim(); if (!v) { inp.focus(); return; }
  let ok;
  if (it.t === "num") {
    let s = v.replace(/\s/g, "");
    if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, "");
    s = s.replace(",", ".");
    const n = parseFloat(s);
    const tol = it.tol || Math.max(1e-9, Math.abs(it.a) * 1e-9);
    ok = Number.isFinite(n) && Math.abs(n - it.a) <= tol + 1e-12;
  } else {
    const nv = norm(v).replace(/\s/g, "");
    ok = it.a.some(a => norm(a).replace(/\s/g, "") === nv);
  }
  inp.disabled = true; inp.classList.add(ok ? "right" : "wrong");
  answer(it, ok);
}
function checkOrder(it) {

  $("#slots").querySelectorAll(".tile").forEach((b, k) => b.classList.add(+b.dataset.i === k ? "right" : "wrong"));
  answer(it, ok, { extra: ok ? "" : `<div class="model"><b>Orden correcto</b><ol style="margin:6px 0 0;padding-left:1.2em">${it.s.map(x => `<li>${inline(x)}</li>`).join("")}</ol></div>` });
}
async function checkOpen(it, skip) {

function answer(it, ok, o = {}) {
  const S = state.session; if (S.answered && !o.force) return;
  S.answered = true;
  const step = S.steps[S.idx]; const sid = step.sid;
  const q = o.quality != null ? o.quality : ok ? 4 : 0;
  schedule(sid, it.id, q);
  const L = todayLog(); L.n++; if (ok) L.c++;
  const gain = ok ? (step.phase === "test" ? 15 : 10) : 2;
  addXp(sid, gain); S.xp += gain;
  S.results.push({ id: it.id, sid, ok, phase: step.phase });
  if (!ok && step.phase !== "retry" && !S.retried.has(it.id) && it.t !== "flash") {
    S.retried.add(it.id);
    const testAt = S.steps.findIndex((x, k) => k > S.idx && x.phase === "test");
    const at = testAt === -1 ? S.steps.length : testAt;
    S.steps.splice(Math.max(S.idx + 3, Math.min(at, S.idx + 6)), 0, { k: "item", phase: "retry", sid, id: it.id });
  }
  touch("p");
  if (!o.silent) beep(ok);
  if (o.noFeedback) { next(); return; }
  const expl = it.e ? `<div class="rich">${rich(it.e)}</div>` : "";
  let correct = "";
  if (!ok && it.t === "fill") correct = `<p>Respuesta: <code class="mono">${esc(it.a[0])}</code></p>`;
  if (!ok && it.t === "num") correct = `<p>Respuesta: <b class="mono">${String(it.a).replace(".", ",")}</b>${it.u ? " " + esc(it.u) : ""}</p>`;
  const head = o.head || (ok ? ["Correcto", "Bien hecho", "Exacto", "Eso es"][Math.floor(Math.random() * 4)] : "No exactamente");
  const fb = `<div class="feedback" id="fb"><h3><span class="fb-ico">${ok ? UI_ICON.check : UI_ICON.wrong}</span><span>${head}${o.note ? ` <span style="font-size:.8rem;font-weight:700;opacity:.8">· ${esc(o.note)}</span>` : ""}</span></h3>${correct}${o.extra || ""}${expl}</div>`;
  setDock(fb + `<button class="btn ${ok ? "ok" : "bad"}" data-act="next">Continuar</button>`, ok ? "fb-ok" : "fb-bad");
  typeset(dock);
}
function next() {
  const S = state.session; S.idx++;
  saveSessionLocal();
  if (S.elapsed >= S.budget && !S.overtimeAsked) {
    const rest = S.steps.slice(S.idx);
    const firstTest = rest.findIndex(x => x.phase === "test");
    if (firstTest > 0) { S.steps.splice(S.idx, firstTest); }
    S.overtimeAsked = true;
    if (firstTest === -1) return finishSession();
  }
  renderStep();
}
function finishSession() {
  const S = state.session;
  clearInterval(tick);
  if (!S.dayMarked && S.results.length >= 5) S.dayMarked = markStudyDay();
  for (const sid of S.sids) { /* lecciones vistas ya se marcan al pasar */ }
  touch("p"); flush(); clearSessionLocal();
  state.view = "end"; renderEnd();
}
function renderEnd() {
  const S = state.session;
  const n = S.results.length, c = S.results.filter(r => r.ok).length;
  const misses = [...new Map(S.results.filter(r => !r.ok).map(r => [r.id, r])).values()].filter(r => !S.results.some(x => x.id === r.id && x.ok && x.phase === "retry"));
  const stk = displayStreak();
  const mins = Math.round(S.elapsed / 60);
  setNav(false);
  root.innerHTML = `<section class="end-hero">
      <span class="burst" style="color:var(--gold)">${UI_ICON.trophy}</span>
      <h1>¡Sesión completada!</h1>
      <p class="muted">Racha de ${stk.n} día${stk.n === 1 ? "" : "s"}</p>
    </section>
    <div class="stats3">
      <div class="stat" style="--c:var(--gold)"><span>XP ganada</span><b>+${S.xp}</b></div>
      <div class="stat" style="--c:var(--ok)"><span>Aciertos</span><b>${n ? Math.round(c / n * 100) : 0}%</b></div>
      <div class="stat" style="--c:var(--sel)"><span>Minutos</span><b>${mins}′</b></div>
    </div>
    ${Object.keys(S.perSubj).length > 1 ? `<section class="card"><h2>Reparto del tiempo</h2><div class="legend">${Object.entries(S.perSubj).map(([sid, sec]) => `<span style="--sc:${sc(sid)}"><i></i>${esc(state.subj[sid].name)} <span class="mono">${Math.round(sec / 60)}′</span></span>`).join("")}</div></section>` : ""}
    <section class="card"><h2>${misses.length ? "Para repasar" : "Sin fallos pendientes"}</h2>
      ${misses.length ? misses.map(r => { const it = state.items[r.id]; return `<div class="miss" style="--sc:${sc(r.sid)}"><span class="eyebrow">${esc(state.subj[r.sid].name)}</span><b>${inline(it.q || it.f)}</b>${it.e ? `<span class="muted">${inline(it.e)}</span>` : ""}</div>`; }).join("") : `<p class="muted">Todo lo que fallaste lo acertaste en la segunda oportunidad. Volverá en unos días para fijarlo.</p>`}
      <p class="muted" style="font-size:.85rem">Las preguntas falladas vuelven mañana en el calentamiento.</p>
    </section>`;
  setDock(`<button class="btn" data-act="home">Continuar</button>`);
  typeset(root); window.scrollTo(0, 0);
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, S = state.session;
  switch (act) {
    case "tab": closeSheet(); state.tab = b.dataset.tab; state.view = "home"; renderTab(); break;
    case "node": openSheet(b.dataset.tid); break;
    case "closesheet": closeSheet(); break;
    case "forgetcode": try { localStorage.removeItem(LS + "-codigo"); } catch (err) { /* nada */ } toast("Código olvidado en este dispositivo."); break;
    case "toggle": { const id = b.dataset.sid; state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); renderTab(); break; }
    case "min": state.minutes = +b.dataset.m; state.p.settings.minutes = state.minutes; touch("p"); renderTab(); break;
    case "surprise": {
      const ranked = state.bundle.subjects.slice().sort((a, b) => priority(b) - priority(a));
      state.selected = new Set(ranked.slice(0, state.minutes >= 25 ? 2 : 1).map(s => s.id));
      renderTab(); toast("Elegidas: " + [...state.selected].map(id => state.subj[id].name).join(" y "));
      break;
    }
    case "start": if (state.selected.size) startSession({ sids: [...state.selected], minutes: state.minutes }); break;
    case "startone": startSession({ sids: [b.dataset.sid], minutes: state.minutes }); break;
    case "exam": startSession({ sids: [b.dataset.sid], minutes: state.minutes, exam: true }); break;
    case "subject": closeSheet(); state.cur = b.dataset.sid; state.view = "subject"; renderSubject(); break;
    case "read": closeSheet(); state.readTid = b.dataset.tid; state.view = "read"; renderRead(); break;
    case "topic": {
      closeSheet();
      const tid = b.dataset.tid; const sid = state.bundle.subjects.find(s => s.topics.some(t => t.id === tid)).id;
      startSession({ sids: [sid], minutes: state.minutes, topic: tid }); break;
    }
    case "home": state.view = "home"; state.session = null; renderHome(); window.scrollTo(0, 0); break;
    case "sound": state.p.settings.sound = !state.p.settings.sound; touch("p"); renderTab(); break;
    case "quit": if (S && S.results.length) finishSession(); else { clearInterval(tick); clearSessionLocal(); state.session = null; state.view = "home"; renderHome(); } break;
    case "lessonnext": {
      const step = S.steps[S.idx]; const tp = state.subj[step.sid].topics.find(x => x.id === step.tid);
      if (step.i + 1 >= tp.lesson.length && !state.p.seen[tp.id]) { state.p.seen[tp.id] = TODAY(); addXp(step.sid, 15); S.xp += 15; touch("p"); }
      S.idx++; saveSessionLocal(); renderStep(); break;
    }
    case "check": {
      const it = state.items[S.steps[S.idx].id];
      if (it.t === "order") checkOrder(it); else if (it.t === "open") checkOpen(it, false); else checkTyped(it);
      break;
    }
    case "skipopen": checkOpen(state.items[S.steps[S.idx].id], true); break;
    case "flip": flipFlash(); break;
    case "fgrade": { const it = state.items[S.steps[S.idx].id]; const q = +b.dataset.q; answer(it, q >= 3, { quality: q, noFeedback: true, silent: true }); break; }
    case "selfgrade": { const it = state.items[S.steps[S.idx].id]; const q = +b.dataset.q; S.answered = false; answer(it, q >= 4, { quality: q, noFeedback: true }); break; }
    case "next": next(); break;
  }
});

/* ---------- arranque ---------- */
/* El contenido va cifrado (AES-256-CBC, PBKDF2-SHA256, formato openssl) con el código de acceso. */
async function decryptBundle(b64, code) {
  const raw = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
  const salt = raw.slice(8, 16), ct = raw.slice(16);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" }, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
const CODE_KEY = LS + "-codigo";
function askCode(cipher, error) {
  root.innerHTML = `
    <header class="top"><div class="brand"><span>Electrolingo</span><svg class="logo" viewBox="36 18 108 128" aria-hidden="true"><polygon fill="#f2b632" stroke="#d99a0f" stroke-width="3" stroke-linejoin="round" points="90,46 104.1,79.6 140.4,82.4 112.8,106.2 121.1,141.6 90,122.6 58.9,141.6 67.2,106.2 39.6,82.4 75.9,79.6"/><path class="cap" d="M68 50 L68 62 Q90 72 112 62 L112 50 Z" fill="#141b24"/><polygon class="cap" points="90,22 138,40 90,58 42,40" fill="#141b24"/><polygon points="90,26 129,40 90,54 51,40" fill="#232d3b"/><circle cx="90" cy="40" r="3.2" fill="#f2b632"/><path d="M90 40 L128 46 L128 66" fill="none" stroke="#f2b632" stroke-width="3" stroke-linecap="round"/><path d="M124 64 L132 64 L134 76 L122 76 Z" fill="#f2b632"/></svg></div></header>
    <form class="card" id="gate" style="margin-top:12vh">
      <div class="eyebrow">Acceso con código</div>
      <h1>Escribe el código para entrar</h1>
      <p class="muted">Te lo tiene que haber dado quien te pasó el enlace. Solo se pide la primera vez en este dispositivo.</p>
      <input class="field" id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Código de acceso" aria-label="Código de acceso">
      ${error ? `<p style="color:var(--bad);font-weight:700">${esc(error)}</p>` : ""}
      <button class="btn" type="submit" id="gate-btn">Entrar</button>
    </form>`;
  setDock("");
  const inp = $("#code"); setTimeout(() => inp.focus(), 50);
  $("#gate").addEventListener("submit", async e => {
    e.preventDefault();
    const code = inp.value.trim().toLowerCase(); if (!code) return;
    const btn = $("#gate-btn"); btn.disabled = true; btn.textContent = "Comprobando…";
    try {
      const bundle = await decryptBundle(cipher, code);
      try { localStorage.setItem(CODE_KEY, code); } catch (err) { /* sin almacenamiento */ }
      start(bundle);
    } catch (err) { askCode(cipher, "Ese código no es correcto. Revísalo y vuelve a probar."); }
  });
}
async function boot() {
  let cipher;
  try {
    const r = await fetch("data/contenido.txt", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    cipher = await r.text();
  } catch (e) {
    root.innerHTML = `<div class="card"><h2>No se pudo cargar el contenido</h2><p class="muted">Comprueba la conexión y recarga la página.</p></div>`;
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(CODE_KEY); } catch (e) { /* nada */ }
  if (saved) {
    try { return start(await decryptBundle(cipher, saved)); }
    catch (e) { try { localStorage.removeItem(CODE_KEY); } catch (err) { /* nada */ } return askCode(cipher, "El código de acceso ha cambiado. Escribe el nuevo."); }
  }
  askCode(cipher, "");
}
function start(bundle) {
  state.bundle = bundle;
  for (const s of bundle.subjects) {
    state.subj[s.id] = s;
    for (const tp of s.topics) for (const it of tp.items) state.items[it.id] = it;
  }
  const saved = lsRead();
  state.p = mergeProgress(saved?.p || {});
  for (const s of bundle.subjects) state.srs[s.id] = Object.assign({ updated: 0, items: {} }, saved?.srs?.[s.id] || {});
  state.minutes = state.p.settings.minutes || 25;
  // por defecto, preselecciona la asignatura con más prioridad
  const top = bundle.subjects.slice().sort((a, b) => priority(b) - priority(a))[0];
  if (top) state.selected.add(top.id);
  // sesión a medias de hoy
  try {
    const ss = JSON.parse(localStorage.getItem(LS + "-sess") || "null");
    if (ss && ss.savedDay === TODAY() && ss.idx < ss.steps.length && ss.steps.every(x => x.k === "lesson" || state.items[x.id])) {
      ss.retried = new Set(ss.retried); state.pendingSession = ss;
    }
  } catch (e) { /* nada */ }
  renderHome();
  connectCloud();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "resume" && state.pendingSession) { state.session = state.pendingSession; state.pendingSession = null; state.view = "session"; startTimer(); renderStep(); }
  if (b.dataset.act === "discard") { state.pendingSession = null; clearSessionLocal(); renderHome(); }
});
boot();
})();
</script>
